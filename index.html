<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boda de Bertha y Josue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="pantalla-carga" class="contenedor-pantalla">
        <div class="contenido-carga">
            <div class="spinner-dorado"></div>
            <p id="texto-carga" class="texto-animado">Preparando experiencia...</p>
        </div>
    </div>

    <div id="pantalla-sobre" class="contenedor-pantalla">
        <img src="sobre1.png" alt="Sobre de invitación" class="imagen-fondo">
        <img src="sello.png" alt="Sello Presiona Aquí" id="sello-interactivo">
    </div>

    <div id="pantalla-video" class="contenedor-pantalla oculto">
        <video id="video-invitacion" playsinline preload="auto">
            <source src="Transicion.mp4" type="video/mp4">  
            Tu navegador no soporta videos.
        </video>
    </div>

    <!-- Capa 3: La Landing Page Web -->
    <div id="pantalla-landing" class="contenedor-pantalla oculto">
        
        <!-- ==========================================
             SECCIÓN 1: PORTADA 
             ========================================== -->
        <div class="grupo-fondo-crema">
            <div class="fondo-sticky-local">
                <img src="fondo.png" alt="Fondo Portada">
            </div>
            <div class="secciones-superpuestas">
                <section class="seccion-apertura escena-parallax">
                    <img src="marco.png" class="capa-parallax" data-speed="0.1" alt="Marco">
                    <img src="flores_arriba.png" class="capa-parallax" data-speed="0.15" alt="Flores Arriba">
                    <img src="flores_abajo.png" class="capa-parallax" data-speed="0.2" alt="Flores Abajo">
                    <img src="separadores.png" class="capa-parallax" data-speed="0.25" alt="Separadores">
                    <img src="boda.png" class="capa-parallax" data-speed="0.35" alt="Boda">
                    <img src="nombres.png" class="capa-parallax" data-speed="0.5" alt="Nombres">

                    <div class="indicador-scroll"><div class="chevron"></div><div class="chevron"></div></div>
                </section>
            </div>
        </div>

        <!-- ==========================================
             SECCIÓN 2: PADRES (¡NUEVA!) 
             ========================================== -->
        <div class="grupo-fondo-crema">
            <div class="fondo-sticky-local">
                <!-- Usamos tu nuevo fondo específico para los padres -->
                <img src="fondo-padres.png" alt="Fondo Padres">
            </div>
            <div class="secciones-superpuestas">
                <section class="seccion-padres escena-parallax">
                    <!-- Diseño con fondo negro: requiere la clase 'capa-fusion' -->
                    <img src="diseño-padres.png" class="capa-parallax capa-fusion" data-speed="0.15" alt="Diseño Dorado Padres">
                    
                    <!-- Textos transparentes: sin capa-fusion y más rápidos (0.35) para que parezcan flotar más alto -->
                    <img src="nombre-padres.png" class="capa-parallax" data-speed="0.35" alt="Nombres de los Padres">
                </section>
            </div>
        </div>

        <!-- ==========================================
             SECCIÓN 3: CONTADOR (Movida al final)
             ========================================== -->
        <div class="grupo-fondo-crema">
            <div class="fondo-sticky-local">
                <img src="fondo.png" alt="Fondo Contador">
            </div>
            <div class="secciones-superpuestas">
                <section class="seccion-contador escena-parallax">
                    <img src="flores.png" class="capa-parallax" data-speed="0.15" alt="Flores Arriba">
                    <img src="bodaname.png" class="capa-parallax" data-speed="0.25" alt="Faltan para nuestra Boda">
                    <img src="separadores2.png" class="capa-parallax" data-speed="0.2" alt="Líneas doradas">
                    <img src="inferior.png" class="capa-parallax" data-speed="0.3" alt="Texto Inferior">
                    <img src="casillas.png" class="capa-parallax" data-speed="0.45" alt="Cajas Contador">

                    <div class="capa-parallax capa-numeros-dinamicos" data-speed="0.45">
                        <div class="numero-contador" id="dias">00</div>
                        <div class="numero-contador" id="horas">00</div>
                        <div class="numero-contador" id="minutos">00</div>
                        <div class="numero-contador" id="segundos">00</div>
                    </div>
                </section>
            </div>
        </div>
        
    </div>

    <script src="script.js"></script>
</body>
</html>
